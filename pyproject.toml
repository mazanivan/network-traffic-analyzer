[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "network-traffic-analyzer"
version = "0.2.0"
description = "Small terminal network traffic analyzer built with Scapy."
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "scapy>=2.5,<3",
    "colorama>=0.4.6,<1",
]

[project.scripts]
nta = "nta:main"

[tool.setuptools]
py-modules = ["nta"]
